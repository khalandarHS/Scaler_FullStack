<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        section{
            height: 500px;
            width: 100%;
            border: 3px solid black;
        }
        .box1{
            background-color: rgb(86, 247, 177);
            /* position: relative; */
            margin-top: 10px; 
        }

        .box2{
            background-color: rgb(181, 243, 82);

        }
        header{
            background-color: rgb(255, 128, 0);
            text-align: center;
            padding: 10px;
            position: sticky;
            width: 100%;
            top:0;
  
        }
    </style>
</head>
<body>
    <header>This is the Header of the Page</header>
    <section class="box1">Content box1</section>
    <section class="box2">Content box2</section>
</body>
</html>
